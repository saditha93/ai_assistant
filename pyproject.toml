[project]
name = "crestline-assistant"
version = "0.1.0"
description = "Enterprise knowledge assistant for Crestline Commercial Bank (LangGraph + Gemini + Pinecone)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-core>=1.6,<2",
    "langchain-google-genai==4.4.0",
    "langsmith==0.14.1",
    "pinecone==10.0.0",
    "langchain-mcp-adapters==0.3.2",
    # langchain-mcp-adapters 0.3.x still requires mcp<2
    "mcp==1.30.0",
    "structlog>=24.1",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "streamlit==1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# B008: FastAPI's Depends() in defaults is the framework's documented pattern.
# ASYNC109: CircuitBreaker.call takes a timeout on purpose; it applies asyncio.timeout itself.
ignore = ["B008", "ASYNC109"]
