x-app: &app
  image: crestline-assistant:latest
  build: .
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

services:
  mcp:
    <<: *app
    command: python -m mcp_server.server
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
    ports:
      - "8001:8001"

  api:
    <<: *app
    environment:
      MCP_URL: http://mcp:8001/mcp
    volumes:
      - assistant-state:/app/data/state  # checkpoints, long-term memory, audit log
    ports:
      - "8000:8000"
    depends_on:
      - mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5

  ui:
    <<: *app
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  assistant-state:
